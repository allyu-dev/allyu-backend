apiVersion: apps/v1
kind: Deployment
metadata:
  name: allyu-backend
  namespace: allyu
  labels:
    app: allyu-backend
spec:
  replicas: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: allyu-backend

  template:
    metadata:
      labels:
        app: allyu-backend
    spec:
      containers:
        - name: api
          image: allyu-backend:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NODE_ENV
              value: production
            - name: PORT
              value: "3000"

          resources:
            requests:
              cpu: 50m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi

          volumeMounts:
            - name: firebase-service-account
              mountPath: /app/serviceAccountKey.json
              subPath: serviceAccountKey.json
              readOnly: true

          readinessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 5
            periodSeconds: 10

          livenessProbe:
            httpGet:
              path: /health
              port: 3000
            initialDelaySeconds: 15
            periodSeconds: 20

      volumes:
        - name: firebase-service-account
          secret:
            secretName: allyu-firebase-admin